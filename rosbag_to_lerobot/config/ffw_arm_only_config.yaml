rosbag_to_lerobot_converter:
  ros__parameters:
    # Basic conversion parameters
    # Support both single directory (string) and multiple directories (list)
    rosbag_dir: 
    - '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test1'
    - '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test2'
    - '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test3'
    output_repo_id: 'ROBOTIS/ffw_sg2_rev1_0220_dataset_merged_converted_v21'
    task_name: 'Test motion'
    fps: 30
    use_videos: true
    robot_type: 'ffw_arm_only'
    use_optimized_save_mode: true
    # Map from rosbag directory path to list of episode indices to skip
    skip_episodes:
      '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test1': []
      '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test2': []
      '/workspace/rosbag/kimtaehyeong/ffw_sg2_rev1_0220_dataset_test3': []

    # Camera configuration
    camera_topics:
      cam_left_head: '/robot/camera/cam_left_head/image_raw/compressed'
      cam_right_head: '/robot/camera/cam_right_head/image_raw/compressed'
      cam_left_wrist: '/robot/camera/cam_left_wrist/image_raw/compressed'
      cam_right_wrist: '/robot/camera/cam_right_wrist/image_raw/compressed'

    # Resize all camera images to [width, height] before encoding. null = no resize.
    image_resize: [256, 256]

    # Camera rotations (0, 90, 180, 270 degrees)
    camera_rotations:
      cam_left_wrist: 270
      cam_right_wrist: 270

    # Per-joint offsets added to leader (action) data. Omit a joint to apply zero offset.
    # action_joint_offset:
    #   arm_l_joint6: 0.3
    #   arm_r_joint6: 0.3
    #   gripper_l_joint1: 0.1
    #   gripper_r_joint1: 0.1

    # Joint state topics
    joint_state_topics:
      arm_left_follower: '/robot/arm_left_follower/joint_states'
      arm_right_follower: '/robot/arm_right_follower/joint_states'

    # Action topics
    action_topics:
      arm_left_leader: '/robot/arm_left_leader/joint_states'
      arm_right_leader: '/robot/arm_right_leader/joint_states'

    # Joint names in order
    joint_names:
      - 'arm_l_joint1'
      - 'arm_l_joint2'
      - 'arm_l_joint3'
      - 'arm_l_joint4'
      - 'arm_l_joint5'
      - 'arm_l_joint6'
      - 'arm_l_joint7'
      - 'gripper_l_joint1'
      - 'arm_r_joint1'
      - 'arm_r_joint2'
      - 'arm_r_joint3'
      - 'arm_r_joint4'
      - 'arm_r_joint5'
      - 'arm_r_joint6'
      - 'arm_r_joint7'
      - 'gripper_r_joint1'
